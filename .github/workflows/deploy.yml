name: Deploiement vers Hostinger Mandel (etsmandel.com)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploiement Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Recuperation du code
        uses: actions/checkout@v4

      - name: 🧹 Nettoyage Hote FTP
        id: clean_ftp
        run: |
          RAW_HOST="${{ secrets.FTP_SERVER }}"
          CLEAN_HOST=$(echo "$RAW_HOST" | sed -e 's|^[a-zA-Z]*://||' -e 's|/$||' | tr -d ' ')
          echo "host=$CLEAN_HOST" >> $GITHUB_OUTPUT

      - name: 🚀 Synchronisation FTP vers Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.clean_ftp.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/
          port: 21
          exclude: |
            **/.git*
            **/.git*/**
            README.md
            *.sql
            *.zip
            *.ods
            *.csv
            bd/**
            scratch/**
